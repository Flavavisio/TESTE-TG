name: Deploy uploaded Total Gest test app

on:
  push:
    paths:
      - '.deploy/READY'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild uploaded app-principal.js
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/tgpart-* > /tmp/app-principal.js.gz.b64
          base64 -d /tmp/app-principal.js.gz.b64 > /tmp/app-principal.js.gz
          gzip -dc /tmp/app-principal.js.gz > app-principal.js
          echo '54efae088fa86c81d7768304bea3be4f5e53c4767927d6bc280a525927330cee  app-principal.js' | sha256sum -c -
      - name: Commit deployed file and cleanup temporary payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-principal.js
          git rm -r .deploy
          git rm .github/workflows/deploy-tg-upload.yml
          git commit -m 'Deploy Total Gest SMART v6.2 to test'
          git push origin HEAD:main
